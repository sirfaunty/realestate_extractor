<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Capactive Operator Console</title>
<style>
  body { background:#0a0e14; color:#d7dde6; margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace; }
  .box { width:340px; background:#111722; border:1px solid #223047;
    border-radius:10px; padding:32px; }
  h1 { font-size:15px; margin:0 0 4px; color:#4fa3e3;
    letter-spacing:.08em; text-transform:uppercase; }
  .sub { font-size:11.5px; color:#5c6b80; margin-bottom:24px; }
  label { display:block; font-size:11px; color:#8595ab; margin:14px 0 4px;
    text-transform:uppercase; letter-spacing:.06em; }
  input { width:100%; box-sizing:border-box; background:#0a0e14;
    border:1px solid #223047; border-radius:6px; color:#d7dde6;
    padding:9px 12px; font-family:inherit; font-size:13px; }
  input:focus { outline:none; border-color:#4fa3e3; }
  button { width:100%; margin-top:22px; background:#1a5c96; border:0;
    border-radius:6px; color:#fff; padding:11px; font-family:inherit;
    font-size:13px; cursor:pointer; letter-spacing:.04em; }
  button:hover { background:#2270b5; }
  .err { margin-top:14px; font-size:12px; color:#e06c75; }
  .foot { margin-top:22px; font-size:10.5px; color:#3d4a5c; }
</style></head><body>
<form class="box" method="POST">
  <h1>Capactive // Operator</h1>
  <div class="sub">Staff console — all actions are audited.</div>
  <label>Email</label>
  <input type="email" name="email" required autofocus>
  <label>Password</label>
  <input type="password" name="password" required>
  <button type="submit">Authenticate</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <div class="foot">No account? Operators are created via
  create_operator.py on the instance host — never through a UI.</div>
</form>
</body></html>
